// Sample kea-dhcp4.conf for tests: comments in all three styles, a trailing
// comma (Kea accepts it; Debian's packaged config has one), a shared network,
// a CIDR pool and a global reservation.
{
"Dhcp4": {
    "interfaces-config": { "interfaces": [ "eth0" ] },
    "lease-database": { "type": "memfile" },
    "valid-lifetime": 3600,
    # Global option.
    "option-data": [ { "name": "domain-name-servers", "data": "192.0.2.53" } ],
    "reservations": [
        { "hostname": "global-host", "hw-address": "AA:BB:CC:00:00:01", "ip-address": "192.0.2.250" }
    ],
    "subnet4": [
        {
            "id": 1,
            "subnet": "192.0.2.0/24",
            "pools": [ { "pool": "192.0.2.100 - 192.0.2.199" } ],
            "option-data": [ { "name": "routers", "data": "192.0.2.1" } ],
            /* Subnet reservations. "//" inside a string is not a comment: */
            "reservations": [
                { "hostname": "printer", "hw-address": "b8:27:eb:12:34:56", "ip-address": "192.0.2.50", "user-context": { "url": "http://printer/" } },
                { "client-id": "01:11:22:33:44:55:66", "ip-address": "192.0.2.51" },
            ]
        }
    ],
    "shared-networks": [
        {
            "name": "lab",
            "subnet4": [ { "id": 2, "subnet": "198.51.100.0/24", "pools": [ { "pool": "198.51.100.0/28" } ] } ]
        }
    ]
}
}
