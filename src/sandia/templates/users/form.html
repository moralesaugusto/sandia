{% extends "base.html" %}
{% block title %}{% if is_new %}New User{% else %}Edit User{% endif %} - Sandia{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-6">{% if is_new %}New User{% else %}Edit User {{ target.username }}{% endif %}</h1>
<form method="post" action="{% if is_new %}/users/new{% else %}/users/{{ target.id }}/edit{% endif %}" class="bg-slate-900 border border-slate-800 rounded-lg p-6 space-y-4 max-w-lg">
  {% if is_new %}
  <div>
    <label class="block text-sm text-slate-400 mb-1">Username</label>
    <input name="username" required class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 text-sm">
  </div>
  {% endif %}
  <div>
    <label class="block text-sm text-slate-400 mb-1">{% if is_new %}Password{% else %}New password (leave blank to keep current){% endif %}</label>
    <input type="password" name="password" {% if is_new %}required{% endif %} class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 text-sm">
  </div>
  <div>
    <label class="block text-sm text-slate-400 mb-1">Role</label>
    <select name="role" class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 text-sm">
      {% for r in roles %}
      <option value="{{ r }}" {% if target and target.role == r %}selected{% endif %}>{{ r }}</option>
      {% endfor %}
    </select>
  </div>
  {% if not is_new %}
  <label class="flex items-center gap-2 text-sm">
    <input type="checkbox" name="is_active" {% if target.is_active %}checked{% endif %} class="rounded bg-slate-800 border-slate-700">
    Active
  </label>
  {% endif %}
  <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium rounded-md px-4 py-2">Save</button>
</form>
{% endblock %}
