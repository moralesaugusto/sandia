{% extends "base.html" %}
{% block title %}Change Password - Sandia{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-6">Change Password</h1>
<form method="post" action="/account/password" class="bg-slate-900 border border-slate-800 rounded-lg p-6 space-y-4 max-w-md">
  <div>
    <label class="block text-sm text-slate-400 mb-1">Current password</label>
    <input type="password" name="current_password" required class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 text-sm">
  </div>
  <div>
    <label class="block text-sm text-slate-400 mb-1">New password</label>
    <input type="password" name="new_password" required class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 text-sm">
  </div>
  <div>
    <label class="block text-sm text-slate-400 mb-1">Confirm new password</label>
    <input type="password" name="confirm_password" required class="w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 text-sm">
  </div>
  <button type="submit" class="flex items-center gap-1.5 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white text-sm font-medium rounded-lg px-4 py-2">{{ icon('key', 'w-4 h-4') }} Update password</button>
</form>
{% endblock %}
