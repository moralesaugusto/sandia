{% if lines %}
<div class="rounded-lg border border-slate-800 bg-slate-950 p-3 overflow-x-auto max-h-96 overflow-y-auto">
  <pre class="text-xs font-mono leading-5">{% for line in lines %}<span class="{% if line.startswith('+++') or line.startswith('---') %}text-slate-500{% elif line.startswith('+') %}text-emerald-400{% elif line.startswith('-') %}text-red-400{% elif line.startswith('@@') %}text-pink-400{% else %}text-slate-400{% endif %}">{{ line }}</span>
{% endfor %}</pre>
</div>
{% else %}
<p class="text-sm text-slate-500">No changes from the current live config.</p>
{% endif %}
