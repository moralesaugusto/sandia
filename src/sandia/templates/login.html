{% extends "base.html" %}
{% block title %}Sign in - Sandia{% endblock %}
{% block guest_content %}
<div class="min-h-screen flex items-center justify-center px-4 bg-[radial-gradient(ellipse_at_top,_rgba(56,189,248,0.08),_transparent_60%)]">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="w-14 h-14 mb-3">
        <rect width="32" height="32" rx="8" fill="url(#login-logo-g)"/>
        <circle cx="16" cy="9" r="3" fill="white"/>
        <circle cx="8" cy="23" r="3" fill="white"/>
        <circle cx="24" cy="23" r="3" fill="white"/>
        <path d="M16 12v4M16 16l-8 6M16 16l8 6" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <defs>
          <linearGradient id="login-logo-g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop stop-color="#38bdf8"/>
            <stop offset="1" stop-color="#6366f1"/>
          </linearGradient>
        </defs>
      </svg>
      <h1 class="text-2xl font-semibold text-center tracking-tight">Sandia</h1>
      <a href="/about" class="text-xs text-slate-500 hover:text-sky-400">v{{ app_version }}</a>
    </div>
    <form method="post" action="/login" class="bg-slate-900/80 border border-slate-800 rounded-xl p-6 space-y-4 shadow-xl shadow-black/20">
      {% if flash %}
      <div class="rounded-md px-3 py-2 text-sm {% if flash.kind == 'error' %}bg-red-950 text-red-300 border border-red-900{% else %}bg-emerald-950 text-emerald-300 border border-emerald-900{% endif %}">
        {{ flash.message }}
      </div>
      {% endif %}
      <div>
        <label class="block text-sm text-slate-400 mb-1">Username</label>
        <input name="username" required autofocus class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Password</label>
        <input type="password" name="password" required class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white text-sm font-medium rounded-lg py-2 transition-colors">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
