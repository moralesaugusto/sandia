{% if error %}
<p class="text-xs text-red-400 mt-1">{{ error }}</p>
{% else %}
<datalist id="ollama-models">
  {% for name in models %}<option value="{{ name }}">{% endfor %}
</datalist>
<p class="text-xs text-emerald-400 mt-1">{{ _("{n} models available: {names}", n=models | length, names=models | join(', ')) }}</p>
{% endif %}
